<!doctype html><html lang="en"><meta charset="utf-8"><title>Terrain review — Prehistorik 2</title><style>body{background:#222;color:#eee;font:16px system-ui;margin:16px}button,select,input{font:inherit;margin:4px}canvas{display:block;width:min(1280px,100%);image-rendering:auto}pre{white-space:pre-wrap}</style><h1>Terrain and boss review</h1><p>Presentation diagnostics. Play the game at <a href="./">the main page</a>.</p><label>Level<select id="level"></select></label><label>Scene<select id="scene"><option value="start">Start</option><option value="quarter">Quarter</option><option value="middle">Middle</option><option value="threequarter">Three quarters</option><option value="end">End</option><option value="6-boss">Tree boss</option><option value="9-diagonal">Castle diagonal</option><option value="8-cave">Crystal cave</option></select></label><label>Pose<select id="pose"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button id="mode">Show Original</button><button id="motion">Scroll</button><button id="step">Step simulation</button><label>X<input id="x" type="number" value="0" step="16"></label><label>Y<input id="y" type="number" value="0" step="16"></label><canvas id="game"></canvas><pre id="status">Loading…</pre><script type="module">
import{Assets}from'./js/assets.js';import{World}from'./js/engine.js';import{Renderer}from'./js/render.js';import{HDAssets}from'./js/hd.js';import{updateBosses,activateSpecialBoss}from'./js/bosses.js';const $=id=>document.getElementById(id),a=await Assets.load();a.rules=await(await fetch('./rules.json')).json();const pack=await HDAssets.load(),w=new World(a),r=new Renderer($('game'),a);r.setHD(pack);let hd=true,motion=false,offset=0;for(const l of a.game.levels){const o=document.createElement('option');o.textContent=o.value=l.id;$('level').append(o);}function select(){w.loadLevel($('level').selectedIndex);w.godMode=true;const s=$('scene').value;let x=w.camera.x,y=w.camera.y;if(s==='6-boss'){x=736;y=1840;activateSpecialBoss(w);w.specialBoss.bodyFrame=+$('pose').value%3;w.specialBoss.leftFrame=+$('pose').value%4;w.specialBoss.rightFrame=(+$('pose').value+1)%4;updateBosses(w);}else if(s==='9-diagonal'){x=352;y=704;}else if(s==='8-cave'){x=1888;y=512;}else if(s!=='start'){const f={quarter:.25,middle:.5,threequarter:.75,end:1}[s];x=Math.round(w.maxCameraX()*f);}if(w.level.id==='A'){x=y=0;w.finalBoss.pose=+$('pose').value;}w.player.x=x+80;w.player.y=y+150;$('x').value=x;$('y').value=y;offset=0;draw();}function draw(){const x=+$('x').value,y=+$('y').value;w.camera={x:Math.floor(x),y:Math.floor(y)};r.render({...w,renderCamera:{x:x+offset,y:y+offset/4}});$('status').textContent=`Stage ${w.level.id} · camera ${x}, ${y} · ${hd?'HD':'Original'} · pose ${$('pose').value}`;}$('level').onchange=$('scene').onchange=$('pose').onchange=select;$('x').onchange=$('y').onchange=$('x').oninput=$('y').oninput=draw;$('mode').onclick=()=>{hd=!hd;r.setHD(hd?pack:null);$('mode').textContent=hd?'Show Original':'Show HD';draw();};$('motion').onclick=()=>{motion=!motion;$('motion').textContent=motion?'Stop scrolling':'Scroll';};$('step').onclick=()=>{w.step({right:true});draw();};function frame(){if(motion){offset=(offset+.15)%32;draw();}requestAnimationFrame(frame);}select();requestAnimationFrame(frame);
</script></html>
