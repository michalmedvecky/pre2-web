worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm application/octet-stream;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        # Only content-addressed delivery assets may outlive a release.
        location ~ "^/assets/hd/delivery/[A-Za-z0-9_-]+-[0-9a-f]{16}[.]webp$" {
            types {} default_type image/webp;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ~ "^/assets/audio/remaster/[A-Za-z0-9_-]+-[0-9a-f]{16}[.]flac$" {
            types {} default_type audio/flac;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ~ "^/assets/audio/remaster-effects/effect-[0-9]+-[0-9a-f]{16}[.]wav$" {
            types {} default_type audio/wav;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ \.wasm$ { types {} default_type application/wasm; try_files $uri =404; }
        location ~ \.(js|mjs)$ { types {} default_type text/javascript; try_files $uri =404; }
        location ~ \.flac$ { types {} default_type audio/flac; try_files $uri =404; }
        location ~ \.wav$ { types {} default_type audio/wav; try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
    }
}
