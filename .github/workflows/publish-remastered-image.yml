name: Remastered image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remastered-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/michalmedvecky/remastered
  NGINX_IMAGE: ${{ vars.GA_NGINX_IMAGE || 'nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test portal and all three games
        run: npm test
      - name: Verify complete public package
        run: node scripts/verify-package.mjs

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'michalmedvecky/remastered'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify clean source and immutable build inputs
        run: |
          test -z "$(git status --porcelain)"
          node scripts/verify-package.mjs
          node scripts/build-inputs.mjs >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          node -e 'if(!/^(?:docker.io\/library\/)?nginx(?::[a-zA-Z0-9_.-]+)?@sha256:[0-9a-f]{64}$/.test(process.env.NGINX_IMAGE))throw Error("Pin official nginx by SHA256")'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the single Remastered image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NGINX_IMAGE=${{ env.NGINX_IMAGE }}
            VCS_REF=${{ github.sha }}
            BUILD_SOURCE=ci
            BUILD_DIRTY=false
            BUILD_REPOSITORY=https://github.com/${{ github.repository }}
            SOURCE_SNAPSHOT=${{ env.SOURCE_SNAPSHOT }}
            GA_SNAPSHOT=${{ env.GA_SNAPSHOT }}
            PRE2_SNAPSHOT=${{ env.PRE2_SNAPSHOT }}
            FLAPPY_SNAPSHOT=${{ env.FLAPPY_SNAPSHOT }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=remastered
          cache-to: type=gha,mode=max,scope=remastered
      - name: Verify architectures and actual runtime image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_SNAPSHOT: ${{ env.SOURCE_SNAPSHOT }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$IMAGE_DIGEST" > /tmp/remastered-index.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' /tmp/remastered-index.json
          SMOKE_IMAGE="$IMAGE@$IMAGE_DIGEST" node scripts/smoke-container.mjs
      - name: Record exact deployer handoff; no cluster access
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### Remastered image; not deployed'
            echo "Image: \`$IMAGE@$IMAGE_DIGEST\`"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Combined source snapshot: \`$SOURCE_SNAPSHOT\`"
            echo 'Platforms: linux/amd64 and linux/arm64.'
            echo 'Deployer: follow DEPLOYER.md with explicit context, namespace, TLS and reviewed legacy-resource allowlist.'
          } >> "$GITHUB_STEP_SUMMARY"
