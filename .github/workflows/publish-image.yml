name: Publish game image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/michalmedvecky/pre2-web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test game
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Prehistorik 2 web game
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published platform manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > /tmp/manifest.json
          jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' /tmp/manifest.json

      - name: Smoke-test published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --detach --name game-smoke --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -p 127.0.0.1:8080:8080 "$IMAGE@$DIGEST"
          trap 'docker logs game-smoke; docker rm -f game-smoke' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          for path in / /assets/game.json /js/audio.js; do
            curl --fail --output /dev/null "http://127.0.0.1:8080$path"
          done

      - name: Record deployment image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published game image'
            echo "- Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "- Exact deployment image: \`$IMAGE@$DIGEST\`"
            echo '- Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
