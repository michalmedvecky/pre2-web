name: Publish Quest VR image

on:
  push:
    branches: [vr/quest-360]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/vr/quest-360'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/michalmedvecky/pre2-web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test game
        run: npm test

      - name: Install pinned browser test tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Test XR controls, HD rendering, secret reveals and cheat menus
        env:
          PRE2_VR_URL: http://127.0.0.1:5777/vr/
          PRE2_VR_EVIDENCE: /tmp/quest-vr-xr-test
        run: |
          PORT=5777 node scripts/serve.mjs > /tmp/quest-vr-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/quest-vr-server.log' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:5777/vr/
          node scripts/verify-vr-xr-browser.mjs
          PRE2_VR_EVIDENCE=/tmp/quest-vr-xr-test/level-one node scripts/verify-vr-level-one-browser.mjs
          PRE2_VR_EVIDENCE=/tmp/quest-vr-xr-test/hd-fixes node scripts/verify-vr-hd-browser.mjs

      - name: Save XR regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quest-vr-xr-test
          path: /tmp/quest-vr-xr-test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:vr-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Prehistorik 2 Quest VR pilot
          cache-from: type=gha,scope=quest-vr
          cache-to: type=gha,mode=max,scope=quest-vr

      - name: Verify published platform manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > /tmp/manifest.json
          jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' /tmp/manifest.json

      - name: Smoke-test published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --detach --name game-smoke --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -p 127.0.0.1:8080:8080 "$IMAGE@$DIGEST"
          trap 'docker logs game-smoke; docker rm -f game-smoke' EXIT
          curl --fail --connect-timeout 2 --max-time 5 \
            --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz
          for path in /vr/ /vr/js/main.js /vr/js/models.js /vr/js/level-one.js /vr/js/level-one-view.js /vr/js/bear-model.js /vr/js/native-art.js /vr/js/hd-art.js /vr/textures/objects-hd.json /vr/textures/objects-hd.png /vr/textures/tiles-hd.png /vr/native/engine.js /vr/native/cheats.js /vr/native/assets.js /vr/assets/tables.bin /vr/assets/sprites.idx /vr/assets/footer-1.bin /vr/js/simulation.js /vr/js/xr-input.js /vr/js/surfaces.js /vr/textures/grass.png /vr/textures/earth.png /vr/textures/stone.png /vr/textures/bark.png /vr/textures/foliage.png /vr/vendor/three.module.js /vr/vendor/three.core.js /vr/js/compat.js /vr/assets/game.json /vr/assets/level-1.map /vr/assets/union.idx; do
            curl --fail --connect-timeout 2 --max-time 5 \
              --retry 5 --retry-all-errors --retry-delay 1 --output /dev/null "http://127.0.0.1:8080$path"
          done

      - name: Publish tested VR alias and render immutable Kubernetes manifests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:vr-quest" "$IMAGE@$DIGEST"
          node scripts/deploy-vr.mjs --image "$IMAGE@$DIGEST" --no-ingress --render-only /tmp/quest-vr-deploy
          cp deploy/vr/ingress.yaml /tmp/quest-vr-deploy/ingress.example.yaml
          printf '%s\n' "$IMAGE@$DIGEST" > /tmp/quest-vr-deploy/image.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/quest-vr-deploy/commit.txt
          {
            echo '### Published Quest VR image'
            echo "- Commit tag: \`$IMAGE:vr-sha-$GITHUB_SHA\`"
            echo "- Tested rolling tag: \`$IMAGE:vr-quest\`"
            echo "- Exact deployment image: \`$IMAGE@$DIGEST\`"
            echo '- Platforms: linux/amd64, linux/arm64'
            echo '- Download quest-vr-deploy for digest-pinned Kubernetes manifests.'
            echo '- No cluster credentials are stored in GitHub; apply with scripts/deploy-vr.mjs.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest-pinned deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quest-vr-deploy
          path: /tmp/quest-vr-deploy/
          if-no-files-found: error
          retention-days: 30
