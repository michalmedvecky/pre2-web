apiVersion: v1
kind: Namespace
metadata:
  name: prehistorik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prehistorik
  namespace: prehistorik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prehistorik
  template:
    metadata:
      labels:
        app: prehistorik
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game
          # Successful build: commit 7bef9a832a527aa93b0199a9dcb025de0615dccd
          # https://github.com/michalmedvecky/pre2-web/actions/runs/39439685530
          image: ghcr.io/michalmedvecky/pre2-web@sha256:9759492fcf8c4a0df47883f250dab5cbb29e9f431676876a1ca93a8d31f0857b
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prehistorik
  namespace: prehistorik
spec:
  selector:
    app: prehistorik
  ports:
    - name: http
      port: 80
      targetPort: http
