apiVersion: v1
kind: Namespace
metadata:
  name: prehistorik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prehistorik
  namespace: prehistorik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prehistorik
  template:
    metadata:
      labels:
        app: prehistorik
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game
          # Successful build: commit 4d58bb8c088bc190422234bb5a50a930b701fcd3
          # https://github.com/michalmedvecky/pre2-web/actions/runs/39387779879
          image: ghcr.io/michalmedvecky/pre2-web@sha256:ad2c170eb1d8407b1afe5612ce34b0dad5e64e5c1c91bb6e5e7abb23d5c80ca9
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prehistorik
  namespace: prehistorik
spec:
  selector:
    app: prehistorik
  ports:
    - name: http
      port: 80
      targetPort: http
