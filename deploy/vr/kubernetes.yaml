apiVersion: v1
kind: Namespace
metadata:
  name: pre2-vr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pre2-vr
  namespace: pre2-vr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pre2-vr
  template:
    metadata:
      labels:
        app: pre2-vr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game
          # CI publishes :vr-quest after tests; deploy-vr.mjs resolves and pins its digest.
          image: ghcr.io/michalmedvecky/pre2-web:vr-quest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pre2-vr
  namespace: pre2-vr
spec:
  selector:
    app: pre2-vr
  ports:
    - name: http
      port: 80
      targetPort: http
